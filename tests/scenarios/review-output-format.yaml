skill: review-output-format
version: "2026-07-15"
category: structured-output

# Triggering tests for the review-output-format skill.
#
# This skill has `disable-model-invocation: true` — it is an internal
# formatting contract, not something a user should trigger directly via
# natural language. It is invoked programmatically by review specialists and
# the specialist-review orchestrator (plugins/review/skills/specialist-review/SKILL.md) to keep
# finding structure consistent across specialists.
#
# The "positive" list below is intentionally thin: it exists so Check 6
# (trigger-vocabulary matching) has something to verify against the
# description, not to claim this skill should fire from open-ended chat.
# The testable unit is the description field:
#   "Canonical per-finding markdown template and severity tier definitions
#    (CRITICAL/MAJOR/MINOR) shared by every review specialist agent in
#    plugins/review/agents/. Internal formatting contract, not user-triggered
#    directly — invoked by review specialists and the review orchestrator to
#    keep report structure consistent across specialists."
#
# Probe with: "When would you use the review-output-format skill?"

triggering:
  positive:
    # The single literal trigger phrase declared in frontmatter
    - "review output format"

    # Phrases an orchestrator/specialist context would reference internally
    - "what's the canonical finding template for review specialists?"
    - "what are the severity tier definitions for review findings?"

  negative:
    # Should trigger review instead (running an actual review, not asking about its format)
    - "review my changes"
    - "run a review before I open the PR"
    - "check for accessibility issues in this diff"

    # Should trigger other skills entirely
    - "implement the discount feature from the plan"
    - "write tests first for the coupon validator"
    - "reflect on what we learned from this session"

    # Completely unrelated
    - "what's the weather in Seattle?"
    - "fix this null pointer exception in OrderService"

    # Ambiguous edge case: asking about formatting in a completely different context
    - "format this JSON file for readability"

functional:
  - id: review-output-format-01
    description: Every finding compiled into a review report uses the canonical per-finding template fields, regardless of which specialist produced it
    grading: code
    given: |
      A diff touching a Ruby model, an RSpec spec, and a React component —
      enough to dispatch agent-basic-quality, agent-security,
      agent-diff-cleanliness, agent-rails, and agent-react, each with at
      least one finding.
    when: "review my changes"
    then:
      - "Each finding in the report includes a severity tag: [CRITICAL], [MAJOR], or [MINOR]"
      - "Each finding includes a Location field with file:line"
      - "Each finding includes an Issue field describing what's wrong"
      - "Each finding includes an Impact field describing why it matters"
      - "Each finding includes a Fix field describing how to resolve it"
    notes: "Extensions (e.g. agent-stimulus-turbo's Reference field) are allowed; the five core fields must not be redefined."

  - id: review-output-format-02
    description: agent-accessibility findings are normalized from High/Medium/Low into the combined report's High/Medium/Low priority sections, while CRITICAL/MAJOR/MINOR findings from other specialists are normalized into the same sections
    grading: code
    given: |
      A diff touching a JSX component with a missing alt attribute (triggers
      agent-accessibility, reporting High/Medium/Low) alongside a Ruby
      controller with a CRITICAL security issue (triggers agent-security,
      reporting CRITICAL/MAJOR/MINOR).
    when: "check for accessibility issues in this diff"
    then:
      - "agent-accessibility's finding is not relabeled with CRITICAL/MAJOR/MINOR in specialist attribution"
      - "The compiled report's priority sections are High/Medium/Low, not CRITICAL/MAJOR/MINOR"
      - "The CRITICAL security finding lands in the report's High Priority section"
      - "The accessibility finding lands in the report's priority section matching its native High/Medium/Low level"

  - id: review-output-format-03
    description: A specialist that finds no issues is stated explicitly in the final report, never silently omitted
    grading: code
    given: |
      A diff that changes a database migration file with no actual issues —
      agent-database is dispatched but has nothing to report.
    when: "review this diff"
    then:
      - "The report contains an explicit statement that agent-database found no issues (e.g. 'No database issues found.')"
      - "The database section is present in the report, not silently omitted"

  - id: review-output-format-04
    description: Severity tier meaning is applied consistently across specialists — a CRITICAL from one specialist and a CRITICAL from another both land in the same High Priority section without redefinition
    grading: llm-judge
    given: |
      A diff producing a CRITICAL finding from agent-security and a separate
      CRITICAL finding from agent-basic-quality.
    when: "run a review"
    then:
      - "Both CRITICAL findings are normalized to the same High Priority section"
      - "Neither specialist's finding redefines what CRITICAL means — severity is applied consistently, not specialist-specific"
      - "The report does not contain two different explanations of what CRITICAL/High severity means"
