skill: implement
version: "2026-02-24"
category: structured-output

# Triggering tests for the implement skill.
#
# The testable unit is the description field:
#   "Implement phase of RPI methodology. Executes yaks-driven task graph using
#    isolated agents for test-first discipline. Use when executing an
#    implementation plan from the plan-tasks skill."
#
# Probe with: "When would you use the implement skill?"

triggering:
  positive:
    # Direct trigger words from the triggers array
    - "implement the feature from the yaks task graph"
    - "execute plan for the discount codes epic"
    - "build from plan — the draft is approved and ready"

    # Phrases aligned with "executes yaks-driven task graph" intent
    - "the plan is in yaks — start executing it"
    - "run the implementation phases from the task graph"
    - "dispatch agents to execute the implementation plan"

    # Phrases aligned with "use when executing an implementation plan from the plan-tasks skill"
    - "plan-tasks is done, now run implement to build it"
    - "I approved the plan — proceed with implementation"
    - "pick up where we left off on the yaks epic"

    # Resuming an interrupted session
    - "resume the implementation — we got interrupted last session"

    # Edge case: user says just "implement" without mentioning yaks/plan
    - "implement the OAuth feature"

  negative:
    # Should trigger research instead
    - "research how the existing order flow works"
    - "explore the codebase before we start building"
    - "investigate the discount logic before implementing"

    # Should trigger plan-tasks instead (still in planning phase)
    - "create the implementation plan for the OAuth feature"
    - "draft a plan with yaks tasks for the team"
    - "write an implementation roadmap before we code"

    # Should trigger tdd instead (writing tests directly, outside implement orchestration)
    - "write failing tests for the discount code validator"
    - "do TDD on the payment processor module"
    - "red green refactor the new auth middleware"

    # Should trigger reflect instead
    - "do a retrospective on the implementation session"
    - "reflect on what we learned from implementing this feature"

    # Completely unrelated / simple tasks
    - "fix the lint error in PaymentService.ts"
    - "explain what dependency injection is"
    - "what does the `--no-emit` flag do in TypeScript?"

    # Ambiguous edge case: "run" could mean run tests, not execute plan
    - "run the tests for the new feature"

functional:
  - id: implement-01
    description: Creates implement-execution-log.md with structured entries at the start of every session
    grading: code
    given: |
      A project with a yaks epic containing three tasks: P1 Write Test, P1 Implement, P1 Validate.
      No implement-execution-log.md exists yet. The user has a complete plan ready to execute.
    when: "execute plan for the discount codes epic"
    then:
      - "File implement-execution-log.md exists in the project root"
      - "File contains at least one [DISPATCHED] entry"
      - "File contains entries for agent types: agent-test, agent-impl, or agent-validate"
      - "File contains [GATE PASS] or [GATE FAIL] entries after each agent completes"
      - "File contains [CLOSED] entry after each successfully gated issue"
    notes: "Log must be created before first agent dispatch, not after. Check timestamp order if automated."

  - id: implement-02
    description: Gate pass path — RED gate passes, GREEN gate passes, VALIDATE gate passes, issue closed
    grading: code
    given: |
      A yaks epic with a single TDD phase: P1 Write Test, P1 Implement, P1 Validate.
      Agent 1 writes tests that fail (RED gate passes).
      Agent 2 writes implementation that makes tests pass (GREEN gate passes).
      Agent 3 runs full suite — tsc, vitest, biome all exit 0 (VALIDATE gate passes).
    when: "implement the feature from the yaks task graph"
    then:
      - "implement-execution-log.md contains [GATE PASS] entry for RED gate"
      - "implement-execution-log.md contains [GATE PASS] entry for GREEN gate"
      - "implement-execution-log.md contains [GATE PASS] entry for VALIDATE gate"
      - "implement-execution-log.md contains [CLOSED] entry for the Validate issue"
      - "No [REMEDIATION] entries appear in the log"
      - "No [BLOCKED] entries appear in the log"

  - id: implement-03
    description: RED gate fail causes hard stop — does not proceed to implementation
    grading: llm-judge
    given: |
      A yaks epic with P1 Write Test and P1 Implement tasks.
      Agent 1 writes tests that pass immediately (feature already exists or tests are tautological).
      The RED gate check detects that the tests pass before any implementation code is written.
    when: "execute plan for the discount codes epic"
    then:
      - "implement-execution-log.md contains [GATE FAIL] entry for RED gate with reason"
      - "Claude stops and reports the RED gate failure to the user"
      - "P1 Implement issue is NOT dispatched (no [DISPATCHED] entry for agent-impl)"
      - "P1 Implement issue is left open for user decision"
      - "The explanation mentions that the test is either tautological or the feature already exists"
    notes: "Hard stop is critical — Claude must not proceed to implementation when RED gate fails."

  - id: implement-04
    description: GREEN gate fail proceeds to validation — enters remediation via dynamic issue creation
    grading: code
    given: |
      A yaks epic with P1 Write Test, P1 Implement, P1 Validate tasks.
      Agent 1 writes failing tests (RED passes).
      Agent 2 cannot make tests pass (GREEN gate fails).
      Agent 3 reports full failure output.
    when: "implement the feature from the yaks task graph"
    then:
      - "implement-execution-log.md contains [GATE FAIL] entry for GREEN gate"
      - "Agent 3 (Validate) is still dispatched after GREEN gate failure"
      - "implement-execution-log.md contains a [REMEDIATION] entry with attempt 1"
      - "A new remediation issue is created (P1: Remediate — attempt 1)"
      - "A new re-validation issue is created (P1: Re-Validate — attempt 1)"
    notes: "GREEN fail must not stop execution — it must proceed to Agent 3 for the full failure report."

  - id: implement-05
    description: Lint fast path — biome-only VALIDATE failure auto-fixed without creating remediation issues
    grading: code
    given: |
      A yaks epic where Agent 3's VALIDATE run finds: tsc exits 0, vitest exits 0, but biome exits 1
      (lint errors only — no type errors, no test failures).
    when: "execute plan for the discount codes epic"
    then:
      - "implement-execution-log.md does NOT contain a [REMEDIATION] entry for this phase"
      - "Claude runs biome check --write (no --unsafe) on the files the lint output names, logged [WRITE]"
      - "Claude re-dispatches the validate task after the auto-fix"
      - "If re-run passes, [GATE PASS] for VALIDATE appears in the log"
      - "No new remediation or re-validation yaks tasks are created for a biome-only failure"
    notes: "Fast path is a correctness test — heavyweight remediation for trivial lint errors is an anti-pattern."

  - id: implement-06
    description: Remediation limit — escalates to user after 2 failed remediation attempts
    grading: llm-judge
    given: |
      A yaks epic where Agent 3 finds failures, remediation attempt 1 is dispatched and re-validation
      still fails, remediation attempt 2 is dispatched and re-validation still fails.
    when: "execute plan for the discount codes epic"
    then:
      - "implement-execution-log.md contains [REMEDIATION] entries for attempt 1 and attempt 2"
      - "implement-execution-log.md contains a [BLOCKED] entry after attempt 2 fails"
      - "Claude stops and asks the user for guidance"
      - "Claude does NOT attempt a third remediation automatically"
      - "The blocked issue is reported to user"

  - id: implement-07
    description: Session manifest written after final verification with correct file lists and gate counts
    grading: code
    given: |
      A yaks epic with two TDD phases: P1-Core-Logic (write-test, implement, validate) and
      P2-HTTP-Route (write-test, implement, validate). All gates pass. A research artifact
      exists at .light/sessions/discount-codes-research.md. Agent reports include:
      - agent-test P1: Files created: src/lib/discount.test.ts
      - agent-impl P1: Files created/modified: src/lib/discount.ts
      - agent-test P2: Files created: src/app/api/discounts/route.test.ts
      - agent-impl P2: Files created/modified: src/app/api/discounts/route.ts
    when: "execute plan for the discount codes epic"
    then:
      - "File .light/sessions/YYYY-MM-DD-discount-codes.manifest.json exists"
      - "Manifest contains version field set to 1"
      - "Manifest files_created includes test and implementation file paths"
      - "Manifest workflow_steps includes research, plan, and implement"
      - "Manifest gates.red_passed equals 2"
      - "Manifest gates.green_passed equals 2"
      - "Manifest gates.validate_passed equals 2"
      - "Manifest test_suite_passed is true"
      - "Manifest phases_completed equals total_phases"

  - id: implement-08
    description: Session manifest file tracking correctly classifies files from agent-no-test phases
    grading: llm-judge
    given: |
      A yaks epic with P1-Schema-Setup (no-test, creates prisma migration) and P2-Core-Logic (TDD).
      Agent reports include:
      - agent-no-test P1: Files created/modified: prisma/schema.prisma, prisma/migrations/001_add_discounts/migration.sql
      - agent-test P2: Files created: src/lib/discount.test.ts
      - agent-impl P2: Files created/modified: src/lib/discount.ts
      prisma/schema.prisma existed before the session. The migration file did not.
    when: "implement the feature from the yaks task graph"
    then:
      - "prisma/migrations/001_add_discounts/migration.sql appears in files_created (new file)"
      - "prisma/schema.prisma appears in files_modified (existed before session)"
      - "src/lib/discount.test.ts appears in files_created"
      - "src/lib/discount.ts appears in files_created or files_modified depending on whether agent-impl created or modified it"
      - "The classification considers file existence before session start, not just the agent report label"

  - id: implement-09
    description: Session recovery — resumes an interrupted implementation from task graph state
    grading: llm-judge
    given: |
      A yaks epic with 6 phases. P1 and P2 are done. P3 has 01-write-tests done and 02-implement in progress.
      This is a fresh Claude Code session (no prior conversation context).
    when: "resume the implementation — we got interrupted on the discount codes feature"
    then:
      - "Skill detects yaks mode and reads the epic"
      - "Readiness computation identifies P3/02-implement as the next ready task"
      - "Skill does NOT re-dispatch P1 or P2 tasks (they are done)"
      - "Skill does NOT re-dispatch P3/01-write-tests (it is done)"
      - "Skill dispatches P3/02-implement as the next agent"
    notes: "Tests session recovery via task graph state. Common failure: re-running completed phases."

  - id: implement-10
    description: Parallel dispatch — same-prefix phases dispatched in a single message
    grading: llm-judge
    given: |
      A yaks epic where P1 is done. P2-Feature-A and P2-Feature-B are independent phase groups
      (same P2 prefix). Both have 01-write-tests as their first child.
    when: "continue implementing the feature"
    then:
      - "Readiness computation returns both P2-Feature-A/01-write-tests and P2-Feature-B/01-write-tests"
      - "Both tasks are dispatched in a single message with multiple Task tool calls"
      - "The dispatch message does NOT dispatch P3 tasks (blocked by P2)"
      - "Each dispatched agent receives its own self-contained task context"
    notes: "Tests parallel dispatch across independent phase groups. Common failure: sequential dispatch one at a time."

  - id: implement-11
    description: TEST-DEFECT upheld — orchestrator creates a repair task for agent-test (RED gate N/A), reviews the test diff, then readiness resumes agent-impl
    grading: llm-judge
    given: |
      A yaks epic with P2-Core-Logic: 01-write-tests (done), 02-implement, 03-validate. The epic
      context reads "commit: none" and acceptance criterion: "Discounted totals are rounded to the nearest
      cent." The write-tests test spec says the same.
      Agent outcomes are given below; simulate each dispatch from them and print every dispatch,
      task created, file the orchestrator copies or diffs, claim decision with its reason,
      execution-log entry and message to the user:
      - agent-impl (02-implement): GREEN gate: TEST-DEFECT — src/lib/discount.test.ts:14 asserts
        applyDiscount(19.99, "SAVE10") toBe 17.991; the criterion requires rounding to the cent (17.99)
      - agent-test (test repair): Files modified: src/lib/discount.test.ts (line 14 only, toBe 17.99);
        test command: all 6 tests pass (the implementation already rounds); RED gate: N/A
      - agent-impl (02-implement): GREEN gate: PASS
      - agent-validate (03-validate): VALIDATE gate: PASS
    when: "execute plan for the discount codes epic"
    then:
      - "The orchestrator compares the cited assertion with the test spec and acceptance criterion and upholds the claim"
      - "The execution log contains [REMEDIATION] for 02-implement with attempt 1 and cause=TEST-DEFECT"
      - "A repair task 01r-test-repair-attempt-1 (agent-type agent-test) is created in P2-Core-Logic with the report and the criterion; the cited file is copied as a diff baseline"
      - "The repair's passing run with RED gate N/A is accepted, not treated as a RED gate FAIL"
      - "The orchestrator diffs the test against the baseline (only line 14 changed; no criterion assertion dropped or weakened) before resuming"
      - "02-implement is re-dispatched after the review; 03-validate runs and the phase closes; no 04-remediate task is created"
      - "No test file is edited by agent-impl, agent-remediate or the orchestrator, and none of them is told to"
    notes: "Upheld path of the TEST-DEFECT route. Trap: the repaired test passes against existing code; treating that as a tautological RED (hard stop) is wrong. Promptfoo sees only the orchestrator's narration, so 'never edits tests' is judged from dispatches and instructions, not real file writes."

  - id: implement-12
    description: TEST-DEFECT rejected — logged as attempt 1, test left intact, validation and remediation (attempt 2) proceed
    grading: llm-judge
    given: |
      A yaks epic with P2-Core-Logic: 01-write-tests (done), 02-implement, 03-validate. The epic
      context reads "commit: none" and acceptance criterion: "Discounted totals are rounded to the nearest
      cent." The write-tests test spec says the same.
      Agent outcomes are given below; simulate each dispatch from them and print every dispatch,
      task created, file the orchestrator copies or diffs, claim decision with its reason,
      execution-log entry and message to the user:
      - agent-impl (02-implement): GREEN gate: TEST-DEFECT — src/lib/discount.test.ts:14 asserts
        applyDiscount(19.99, "SAVE10") toBe 17.99, but 19.99 x 0.9 = 17.991; the test should use toBeCloseTo(17.991)
      - agent-validate (03-validate): VALIDATE gate: FAIL — discount.test.ts:14 expected 17.99, received 17.991 (behavior)
      - agent-remediate: Result: ALL PASS (rounds the total to the cent)
      - agent-validate (re-validation): VALIDATE gate: PASS
    when: "execute plan for the discount codes epic"
    then:
      - "The orchestrator compares the claim with the acceptance criterion and rejects it (the assertion states the criterion)"
      - "The execution log contains [REMEDIATION] for 02-implement: attempt 1, cause=TEST-DEFECT rejected, with the reason"
      - "agent-test is NOT dispatched and src/lib/discount.test.ts is not changed"
      - "02-implement is marked done and 03-validate runs; its failure logs [REMEDIATION] 03-validate attempt 2 and creates 04-remediate-attempt-2 and 05-revalidate-attempt-2"
      - "The remediation context carries the Rejected TEST-DEFECT reason; the re-validation keeps the original validate context"
      - "The phase closes after re-validation passes"
    notes: "Rejected path of the TEST-DEFECT route. Common failures: upholding a claim that contradicts the criterion, stopping at the rejected claim instead of validating, or numbering the remediation attempt 1."

  - id: implement-13
    description: Second TEST-DEFECT claim in the same phase group — orchestrator stops and asks the user instead of deciding or repairing again
    grading: llm-judge
    given: |
      A yaks epic with P2-Core-Logic: 01-write-tests (done), 02-implement, 03-validate. The epic
      context reads "commit: none" and acceptance criteria: "Discounted totals are rounded to the nearest
      cent." and "Expired codes are rejected with an error." The write-tests test spec says the same.
      Agent outcomes are given below; simulate each dispatch from them and print every dispatch,
      task created, file the orchestrator copies or diffs, claim decision with its reason,
      execution-log entry and message to the user:
      - agent-impl (02-implement): GREEN gate: TEST-DEFECT — src/lib/discount.test.ts:14 asserts
        applyDiscount(19.99, "SAVE10") toBe 17.991; the criterion requires rounding to the cent (17.99)
      - agent-test (test repair): Files modified: src/lib/discount.test.ts (line 14 only, toBe 17.99);
        test command: 1 failing (discount.test.ts:31, at an assertion); RED gate: N/A
      - agent-impl (02-implement): GREEN gate: TEST-DEFECT — src/lib/discount.test.ts:31 asserts
        error code "EXPIRED"; the criterion only says expired codes are rejected with an error
    when: "execute plan for the discount codes epic"
    then:
      - "The first claim is upheld: [REMEDIATION] attempt 1 with cause=TEST-DEFECT, repair task 01r-test-repair-attempt-1 accepted with RED gate N/A, diff reviewed, 02-implement re-dispatched"
      - "The second TEST-DEFECT in P2-Core-Logic stops the run: a [BLOCKED] entry is logged and the user is asked how to proceed"
      - "After the second claim no agent is dispatched: no second repair, no 03-validate, no 04-remediate"
      - "02-implement is left open (not marked done)"
      - "discount.test.ts:31 is not changed; no test file is edited by agent-impl, agent-remediate or the orchestrator"
    notes: "Repeated-claim limit. The second claim is debatable on purpose: the rule is to stop and ask, not to decide it. Common failure: rejecting it and continuing as a GREEN failure, or repairing the test a second time."

  - id: implement-14
    description: TEST-DEFECT claim past the attempt budget — a claim from the second remediation is attempt 3, so the orchestrator stops instead of deciding it
    grading: llm-judge
    given: |
      A yaks epic with P2-Core-Logic: 01-write-tests (done), 02-implement, 03-validate. The epic
      context reads "commit: none" and acceptance criteria: "Discounted totals are rounded to the nearest
      cent." and "Expired codes are rejected with an error."
      Agent outcomes are given below; simulate each dispatch from them and print every dispatch,
      task created, file the orchestrator copies or diffs, claim decision with its reason,
      execution-log entry and message to the user:
      - agent-impl (02-implement): GREEN gate: FAIL — 2 tests failing in src/lib/discount.test.ts
      - agent-validate (03-validate): VALIDATE gate: FAIL — discount.test.ts:14 and :22 (behavior)
      - agent-remediate (first remediation): Result: STILL FAILING — discount.test.ts:22
      - agent-validate (first re-validation): VALIDATE gate: FAIL — discount.test.ts:22 (behavior)
      - agent-remediate (second remediation): Result: TEST-DEFECT — src/lib/discount.test.ts:22 asserts
        error code "EXPIRED"; the criterion only says expired codes are rejected with an error
    when: "execute plan for the discount codes epic"
    then:
      - "Remediation is numbered per phase group: [REMEDIATION] attempt 1 creates 04-remediate-attempt-1 / 05-revalidate-attempt-1; the failed re-validation logs attempt 2 and creates 04-remediate-attempt-2 / 05-revalidate-attempt-2"
      - "The TEST-DEFECT from 04-remediate-attempt-2 would be attempt 3, so the orchestrator logs [BLOCKED] and asks the user without deciding the claim"
      - "No [REMEDIATION] entry for attempt 3, no repair task (03r-test-repair-…), and 05-revalidate-attempt-2 is not dispatched"
      - "04-remediate-attempt-2 is left open"
      - "No test file is edited by agent-impl, agent-remediate or the orchestrator"
    notes: "Attempt-budget stop on the TEST-DEFECT route (workflow-detail.md, TEST-DEFECT Route step 2). Common failures: deciding the claim anyway, repairing the test, or running a third remediation."
