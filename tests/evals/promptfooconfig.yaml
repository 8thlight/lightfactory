# Promptfoo eval configuration for implement skill scenarios
# Generated from tests/scenarios/*.yaml
# Run: cd tests/evals && promptfoo eval
# View: promptfoo view

description: lightfactory skill functional evals

providers:
  - id: exec:bash claude-provider.sh
    label: claude-cli

# Use the same claude CLI (Bedrock-authenticated) as the LLM judge
# for llm-rubric assertions — no OPENAI_API_KEY needed.
defaultTest:
  options:
    provider:
      id: exec:bash claude-provider.sh
      label: claude-cli-judge

# ---------------------------------------------------------------------------
# RESEARCH skill scenarios
# ---------------------------------------------------------------------------
tests:

  # research-01: Produces a valid research artifact at the correct path with all required sections
  - description: "[research-01] Produces valid research artifact with all required sections"
    vars:
      prompt: |
        GIVEN: A project with a .light/ directory. No prior research artifacts exist.

        TASK: research how authentication is implemented in this codebase before I add OAuth support
    assert:
      - type: icontains
        value: ".light/"
      - type: regex
        value: "\\d{4}-\\d{2}-\\d{2}-[a-z0-9-]+-research\\.md"
      - type: icontains
        value: "## Summary"
      - type: icontains
        value: "## Relevant Files"
      - type: icontains
        value: "## Existing Patterns"
      - type: icontains
        value: "## Web Research"
      - type: icontains
        value: "## Open Questions"
      - type: icontains
        value: "## Next Steps"
    metadata:
      skill: research
      grading: code

  # research-02: All agents are dispatched in a single parallel message, not sequentially
  - description: "[research-02] Agents dispatched in parallel, not sequentially"
    vars:
      prompt: |
        GIVEN: A project with multiple modules. Research scope implies at least 2 codebase areas and 1 web topic.

        TASK: research how to add a webhooks system — look at the existing event system and find best practices
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the research skill dispatched agents in parallel.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Parallel dispatch (1-3): Did multiple Task tool calls appear in a single message?
            1 = Agents were dispatched sequentially across multiple turns
            2 = Some parallelism but not all agents batched together
            3 = Multiple Task calls issued in a single message (true parallel dispatch)

          Dimension 2 — Codebase exploration (1-3): Was at least one Task call for codebase exploration?
            1 = No codebase exploration agent was dispatched
            2 = Codebase exploration was mentioned but dispatch is unclear
            3 = At least one Task call clearly targeted codebase exploration

          Dimension 3 — Web research (1-3): Was at least one Task call for web research?
            1 = No web research agent was dispatched
            2 = Web research was mentioned but dispatch is unclear
            3 = At least one Task call clearly targeted web research or best practices

          Dimension 4 — No sequential await pattern (1-3): Did the skill avoid the sequential dispatch anti-pattern?
            1 = Clear sequential pattern: agent A dispatched, awaited, then agent B dispatched
            2 = Partially sequential but some batching evident
            3 = No sequential await pattern detected; all agents launched together

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: research
      grading: llm-judge

  # research-03: Web Research section includes confidence levels on every finding
  - description: "[research-03] Web Research section includes confidence levels on every finding"
    vars:
      prompt: |
        GIVEN: A project where the feature involves an external library or pattern not present in the codebase.

        TASK: research best practices for implementing rate limiting before I add it to the API
    assert:
      - type: icontains
        value: "## Web Research"
      - type: regex
        value: "(?i)(High|Medium|Low)"
      - type: llm-rubric
        value: |
          Evaluate whether every web finding in the Web Research section is labeled with a confidence level (High, Medium, or Low).
          PASS if all web findings have a confidence label and at least one finding is present.
          FAIL if any finding lacks a confidence label or the Web Research section is empty.
    metadata:
      skill: research
      grading: code

  # research-04: AskUserQuestion is called to present findings for user review before completing
  - description: "[research-04] AskUserQuestion called with findings summary before completing"
    vars:
      prompt: |
        GIVEN: A project. Skill has synthesized findings and written the artifact to disk.

        TASK: research how the plugin system works before I add a new skill
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the research skill correctly used AskUserQuestion before completing.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — AskUserQuestion usage (1-3): Was AskUserQuestion (or equivalent user-facing question) called?
            1 = No user question was presented; skill completed silently
            2 = A summary was presented but not as an explicit question/prompt for user input
            3 = AskUserQuestion was called with a summary of key findings

          Dimension 2 — Findings summary quality (1-3): Did the question include 3-5 bullet points of key findings?
            1 = No bullet points or fewer than 3 findings listed
            2 = Findings present but fewer than 3 or more than 5 bullet points
            3 = Exactly 3-5 bullet point findings included in the question

          Dimension 3 — Artifact path included (1-3): Did the question include the artifact file path?
            1 = No artifact path mentioned in the question
            2 = Artifact path mentioned in the response but not in the question itself
            3 = Artifact file path is included within the AskUserQuestion message

          Dimension 4 — Waits for response (1-3): Did the skill wait for user response before marking complete?
            1 = Skill completed and moved on without waiting for user input
            2 = Skill paused but completion was ambiguous
            3 = Skill explicitly waited for user response before proceeding or concluding

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: research
      grading: llm-judge

  # research-05: Hard stop after next-steps output — no code, planning, or further tool calls
  - description: "[research-05] Hard stop after next-steps — no code, planning, or further tool calls"
    vars:
      prompt: |
        GIVEN: Research artifact has been written and user has approved it.

        TASK: research how discount codes are handled, then go ahead and draft the plan too
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the research skill enforced its phase boundary and stopped after presenting next steps.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Next-steps output (1-3): Did the skill present a Research Complete block with next steps?
            1 = No next-steps or Research Complete block presented
            2 = Next steps mentioned but informal, not a structured block
            3 = Research Complete block with artifact path and ordered next steps was presented

          Dimension 2 — No plan-tasks invocation (1-3): Did the skill refrain from invoking plan-tasks or creating plan files?
            1 = Plan-tasks was invoked or a plan file was created
            2 = Plan-tasks was not invoked but planning content was generated inline
            3 = No plan-tasks invocation and no plan file was created

          Dimension 3 — No code written (1-3): Did the skill refrain from writing any code files?
            1 = Code files were written
            2 = Code snippets suggested but no files written
            3 = No code files were written

          Dimension 4 — Hard stop enforced (1-3): Did the skill stop after presenting next steps with no further tool calls?
            1 = Additional tool calls occurred after the next-steps output
            2 = Skill stopped but with some residual output that blurred the boundary
            3 = Clean stop — no further tool calls after next-steps output was presented

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: research
      grading: llm-judge

# ---------------------------------------------------------------------------
# PLAN-TASKS skill scenarios
# ---------------------------------------------------------------------------

  # plan-tasks-01: Produces a valid plan file at the correct path with all required sections
  - description: "[plan-tasks-01] Produces valid plan file with all required sections"
    vars:
      prompt: |
        GIVEN: A project with a .light/ directory. A research artifact exists at
        .light/2026-02-24-add-discount-codes-research.md with summary findings.

        TASK: draft .light/2026-02-24-add-discount-codes-research.md
    assert:
      - type: regex
        value: ".light/2026-02-24-add-discount-codes-plan\\.md"
      - type: icontains
        value: "## Goal"
      - type: icontains
        value: "## Acceptance Criteria"
      - type: icontains
        value: "## Files to Create"
      - type: icontains
        value: "## Files to Modify"
      - type: icontains
        value: "## Implementation Phases"
      - type: icontains
        value: "## Constraints"
      - type: icontains
        value: "## Out of Scope"
    metadata:
      skill: plan-tasks
      grading: code

  # plan-tasks-02: Every TDD implementation phase includes an Agent Context block with required fields
  - description: "[plan-tasks-02] Every TDD implementation phase includes a complete Agent Context block"
    vars:
      prompt: |
        GIVEN: A project with application code. Research artifact describes a feature spanning
        multiple layers (core logic + HTTP route).

        TASK: create an implementation plan for adding a discount code validator — include TDD phases
    assert:
      - type: icontains
        value: "#### Agent Context"
      - type: icontains
        value: "Files to"
      - type: icontains
        value: "Test spec"
      - type: icontains
        value: "Test command"
      - type: icontains
        value: "RED gate"
      - type: icontains
        value: "GREEN gate"
      - type: icontains
        value: "Architectural constraints"
    metadata:
      skill: plan-tasks
      grading: code

  # plan-tasks-03: TDD phases are decomposed into exactly 3 yaks tasks (Write Tests, Implement, Validate)
  - description: "[plan-tasks-03] TDD phases decomposed into exactly 3 yaks tasks with correct dependencies"
    vars:
      prompt: |
        GIVEN: A project where yaks is available (yx list returns results without error).
        Research artifact describes a feature with at least one TDD layer.

        TASK: plan the implementation of a discount code feature with TDD phases
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the plan-tasks skill correctly decomposed TDD phases into yaks tasks.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Yaks epic creation (1-3): Was a yaks epic created for the feature?
            1 = No yaks epic was created
            2 = Epic mentioned but creation is ambiguous
            3 = A yaks epic was explicitly created for the feature

          Dimension 2 — TDD issue triplet (1-3): Did each TDD phase produce exactly 3 yaks tasks (Write Tests, Implement, Validate)?
            1 = Fewer than 3 tasks per TDD phase or tasks have wrong names
            2 = 3 tasks created but naming or structure is off
            3 = Exactly 3 tasks per TDD phase: Write Tests, Implement, Validate

          Dimension 3 — Dependency chain (1-3): Are task dependencies correct (Write Tests → Implement → Validate)?
            1 = No dependencies set between tasks
            2 = Some dependencies set but chain is incomplete
            3 = Write Tests blocks Implement; Implement blocks Validate

          Dimension 4 — Non-TDD phases (1-3): Do non-TDD phases (schema, infrastructure) produce exactly 1 yak?
            1 = Non-TDD phases also produce 3 tasks (incorrect)
            2 = Non-TDD phases produce 1-2 tasks (partially correct)
            3 = Non-TDD phases produce exactly 1 yak each

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: plan-tasks
      grading: llm-judge

  # plan-tasks-04: Each yak context is self-contained and does not reference the plan file
  - description: "[plan-tasks-04] Yak contexts are self-contained and do not reference the plan file"
    vars:
      prompt: |
        GIVEN: A project where yaks is available. Draft has completed and created a yaks epic with tasks.

        TASK: draft a plan for adding webhook support to the notification system
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the plan-tasks skill created self-contained yak contexts.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Full Agent Context inline (1-3): Does each yak contain the full Agent Context inline?
            1 = Tasks reference the plan file instead of including Agent Context
            2 = Most tasks have inline context but one or more link back to the plan
            3 = Every yak contains full Agent Context inline without referencing .light/

          Dimension 2 — No plan file references (1-3): Do any tasks contain phrases like "see plan file" or "refer to .light/"?
            1 = One or more tasks contain explicit plan file references
            2 = No direct links but context implies the plan file is required
            3 = No yak context references the plan file in any way

          Dimension 3 — Standalone executability (1-3): Could an agent execute each phase reading only the yak context?
            1 = Agent would need the plan file to understand what to do
            2 = Agent could probably proceed but missing some context
            3 = Each yak is fully self-contained; no external file needed

          Dimension 4 — Agent Context completeness (1-3): Do inline Agent Context blocks include all required fields?
            1 = Missing 3+ required fields (Files, Test spec, Test command, RED gate, GREEN gate, Constraints)
            2 = Missing 1-2 required fields
            3 = All required Agent Context fields present in every yak

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: plan-tasks
      grading: llm-judge

  # plan-tasks-05: Attempts tracker fallback chain when yaks is unavailable (beads then native tasks)
  - description: "[plan-tasks-05] Attempts tracker fallback chain when yaks is unavailable"
    vars:
      prompt: |
        GIVEN: A project where yaks is NOT available (yx list returns a tool-not-found error or similar).
        No .beads/config.yaml exists. No native task tool is configured.

        TASK: plan the implementation of user profile photo uploads
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the plan-tasks skill correctly walked the three-tier tracker fallback chain.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Yaks detection and stop (1-3): Did the skill detect yaks is unavailable and stop issuing yx commands?
            1 = yx commands were issued after the availability check
            2 = No yx commands but no evidence of an explicit detection step
            3 = Skill detected yaks unavailability and issued no further yx commands

          Dimension 2 — Beads detection attempted (1-3): Did the skill check for .beads/config.yaml before moving on?
            1 = No beads detection attempted
            2 = Beads mentioned but no explicit check for .beads/config.yaml
            3 = Skill explicitly checked for .beads/config.yaml as the second fallback tier

          Dimension 3 — Native task tool attempted (1-3): Did the skill attempt TaskCreate before falling back to inline?
            1 = No attempt to use TaskCreate
            2 = TaskCreate mentioned but not clearly attempted
            3 = Skill attempted TaskCreate as the third fallback tier before producing inline graph

          Dimension 4 — Inline graph as final fallback (1-3): Does the plan contain an Inline Task Graph section as the final fallback?
            1 = No Inline Task Graph section present
            2 = Inline graph present but fallback ordering is unclear
            3 = ## Inline Task Graph section is present and is clearly the last resort after all trackers failed

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: plan-tasks
      grading: llm-judge

  # plan-tasks-06: Falls back to beads when yaks is unavailable but beads is initialized
  - description: "[plan-tasks-06] Falls back to beads when yaks unavailable but beads is initialized"
    vars:
      prompt: |
        GIVEN: A project where yaks is NOT available (yx list returns a tool-not-found error or similar).
        A .beads/config.yaml file exists (beads is initialized).

        TASK: plan the implementation of user profile photo uploads
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the plan-tasks skill correctly fell back to beads when yaks was unavailable.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Yaks detection and stop (1-3): Did the skill detect yaks is unavailable and stop issuing yx commands?
            1 = yx commands were issued after the availability check
            2 = No yx commands but no evidence of an explicit detection step
            3 = Skill detected yaks unavailability and issued no further yx commands

          Dimension 2 — Beads detection (1-3): Did the skill detect .beads/config.yaml and select beads as the tracker?
            1 = Skill did not detect or use beads
            2 = Beads mentioned but selection based on config file is unclear
            3 = Skill detected .beads/config.yaml and explicitly chose beads as the tracker

          Dimension 3 — beads:epic and beads:create used (1-3): Were beads:epic and beads:create commands used?
            1 = Neither beads:epic nor beads:create was used
            2 = One of the two commands was used but not both
            3 = Both beads:epic and beads:create were used to create the epic and tasks

          Dimension 4 — No yx commands after detection (1-3): Were all yx commands absent after the initial detection fails?
            1 = yx commands appear after the detection failure
            2 = No yx commands but the boundary is ambiguous
            3 = No yx commands appear anywhere after the initial availability check

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: plan-tasks
      grading: llm-judge

  # plan-tasks-07: Falls back to native tasks when neither yaks nor beads is available
  - description: "[plan-tasks-07] Falls back to native TaskCreate when neither yaks nor beads available"
    vars:
      prompt: |
        GIVEN: A project where yaks is NOT available (yx list returns a tool-not-found error or similar).
        No .beads/config.yaml exists (beads not initialized).

        TASK: plan the implementation of user profile photo uploads
    assert:
      - type: icontains
        value: "TaskCreate"
      - type: regex
        value: "Write Tests|Implement|Validate"
    metadata:
      skill: plan-tasks
      grading: code

# ---------------------------------------------------------------------------
# IMPLEMENT skill scenarios
# ---------------------------------------------------------------------------

  # implement-01: Creates implement-execution-log.md with structured entries at start of every session
  - description: "[implement-01] Creates implement-execution-log.md with structured entries"
    vars:
      prompt: |
        GIVEN: A project with a yaks epic containing three tasks: P1 Write Test, P1 Implement, P1 Validate.
        No implement-execution-log.md exists yet. The user has a complete plan ready to execute.

        TASK: execute plan for the discount codes epic
    assert:
      - type: icontains
        value: "implement-execution-log.md"
      - type: icontains
        value: "[DISPATCHED]"
      - type: regex
        value: "\\[GATE (PASS|FAIL)\\]"
      - type: icontains
        value: "[CLOSED]"
      - type: regex
        value: "agent-test|agent-impl|agent-validate"
    metadata:
      skill: implement
      grading: code

  # implement-02: Gate pass path — RED, GREEN, VALIDATE all pass, issue closed
  - description: "[implement-02] Full gate pass path — RED, GREEN, VALIDATE all pass, issue closed"
    vars:
      prompt: |
        GIVEN: A yaks epic with a single TDD phase: P1 Write Test, P1 Implement, P1 Validate.
        Agent 1 writes tests that fail (RED gate passes).
        Agent 2 writes implementation that makes tests pass (GREEN gate passes).
        Agent 3 runs full suite — tsc, vitest, biome all exit 0 (VALIDATE gate passes).

        TASK: implement the feature from the yaks task graph
    assert:
      - type: regex
        value: "\\[GATE PASS\\].*RED|RED.*\\[GATE PASS\\]"
      - type: regex
        value: "\\[GATE PASS\\].*GREEN|GREEN.*\\[GATE PASS\\]"
      - type: regex
        value: "\\[GATE PASS\\].*VALIDATE|VALIDATE.*\\[GATE PASS\\]"
      - type: icontains
        value: "[CLOSED]"
    metadata:
      skill: implement
      grading: code

  # implement-03: RED gate fail causes hard stop — does not proceed to implementation
  - description: "[implement-03] RED gate fail causes hard stop — implementation not dispatched"
    vars:
      prompt: |
        GIVEN: A yaks epic with P1 Write Test and P1 Implement tasks.
        Agent 1 writes tests that pass immediately (feature already exists or tests are tautological).
        The RED gate check detects that the tests pass before any implementation code is written.

        TASK: execute plan for the discount codes epic
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the implement skill correctly enforced the RED gate hard stop.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — RED gate FAIL logged (1-3): Does implement-execution-log.md contain a [GATE FAIL] entry for RED gate?
            1 = No [GATE FAIL] entry for RED gate
            2 = Failure mentioned informally but not as a [GATE FAIL] log entry
            3 = [GATE FAIL] entry for RED gate with a reason is present

          Dimension 2 — Hard stop enforced (1-3): Did Claude stop and report the failure to the user?
            1 = Claude continued to P1 Implement despite RED gate failure
            2 = Claude paused but the stop was unclear or implicit
            3 = Claude explicitly stopped and reported the RED gate failure to the user

          Dimension 3 — P1 Implement not dispatched (1-3): Was the P1 Implement issue NOT dispatched?
            1 = [DISPATCHED] entry for agent-impl appears in the log
            2 = No dispatch but ambiguous whether the decision was deliberate
            3 = No [DISPATCHED] entry for agent-impl; issue left open for user decision

          Dimension 4 — Explanation quality (1-3): Did the explanation mention tautological tests or pre-existing feature?
            1 = No explanation given for the failure
            2 = Failure reported but cause not identified
            3 = Explanation mentions that the test is tautological or the feature already exists

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: implement
      grading: llm-judge

  # implement-04: GREEN gate fail proceeds to validation — enters remediation via dynamic task creation
  - description: "[implement-04] GREEN gate fail proceeds to validation and enters remediation"
    vars:
      prompt: |
        GIVEN: A yaks epic with P1 Write Test, P1 Implement, P1 Validate tasks.
        Agent 1 writes failing tests (RED passes).
        Agent 2 cannot make tests pass (GREEN gate fails).
        Agent 3 reports full failure output.

        TASK: implement the feature from the yaks task graph
    assert:
      - type: icontains
        value: "[GATE FAIL]"
      - type: icontains
        value: "[REMEDIATION]"
      - type: regex
        value: "attempt 1|attempt-1"
      - type: regex
        value: "Remediate|remediation"
      - type: regex
        value: "Re-Validate|re-validate|revalidate"
    metadata:
      skill: implement
      grading: code

  # implement-05: Lint fast path — biome-only VALIDATE failure auto-fixed without creating remediation tasks
  - description: "[implement-05] Lint fast path — biome-only failure auto-fixed without remediation tasks"
    vars:
      prompt: |
        GIVEN: A yaks epic where Agent 3's VALIDATE run finds: tsc exits 0, vitest exits 0, but biome exits 1
        (lint errors only — no type errors, no test failures).

        TASK: execute plan for the discount codes epic
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the implement skill correctly handled a biome-only lint failure using the fast path.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — No [REMEDIATION] entry (1-3): Does the log NOT contain a [REMEDIATION] entry for this phase?
            1 = [REMEDIATION] entry is present (fast path was not used)
            2 = Remediation was mentioned informally but no formal [REMEDIATION] log entry
            3 = No [REMEDIATION] entry; fast path was correctly applied

          Dimension 2 — biome auto-fix invoked (1-3): Did Claude run biome check --write --unsafe?
            1 = No biome auto-fix command was run
            2 = A biome fix was run but without --write --unsafe flags
            3 = biome check --write --unsafe was invoked to auto-fix lint issues

          Dimension 3 — Re-run after fix (1-3): Was the full VALIDATE gate re-run after auto-fix?
            1 = No re-run after auto-fix
            2 = Re-run mentioned but it is unclear if all checks (tsc, vitest, biome) were included
            3 = Full VALIDATE gate (tsc + vitest + biome) was re-run after auto-fix

          Dimension 4 — No remediation tasks created (1-3): Were no new remediation yaks tasks created?
            1 = Remediation and re-validation tasks were created unnecessarily
            2 = One unnecessary task was created
            3 = No new remediation or re-validation yaks tasks were created

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: implement
      grading: llm-judge

  # implement-06: Remediation limit — escalates to user after 2 failed remediation attempts
  - description: "[implement-06] Escalates to user after 2 failed remediation attempts"
    vars:
      prompt: |
        GIVEN: A yaks epic where Agent 3 finds failures, remediation attempt 1 is dispatched and re-validation
        still fails, remediation attempt 2 is dispatched and re-validation still fails.

        TASK: execute plan for the discount codes epic
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the implement skill correctly escalated to the user after 2 failed remediation attempts.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Two remediation entries (1-3): Does the log contain [REMEDIATION] entries for attempt 1 and attempt 2?
            1 = Fewer than 2 [REMEDIATION] entries
            2 = 2 entries present but not clearly labeled attempt 1 and attempt 2
            3 = [REMEDIATION] entries for both attempt 1 and attempt 2 are present

          Dimension 2 — [BLOCKED] entry (1-3): Does the log contain a [BLOCKED] entry after attempt 2 fails?
            1 = No [BLOCKED] entry
            2 = Blocked state mentioned informally without a [BLOCKED] log entry
            3 = [BLOCKED] entry appears in the log after attempt 2 fails

          Dimension 3 — User escalation (1-3): Did Claude stop and ask the user for guidance?
            1 = Claude attempted a third remediation automatically
            2 = Claude stopped but did not ask for guidance
            3 = Claude stopped and explicitly asked the user for guidance

          Dimension 4 — Yaks task updated (1-3): Was the blocked task updated to blocked status in yaks?
            1 = No yaks status update was performed
            2 = A status update was mentioned but not confirmed
            3 = The blocked task was explicitly updated to blocked status in yaks

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: implement
      grading: llm-judge

  # implement-07: Session manifest written after final verification with correct structure
  - description: "[implement-07] Session manifest written with correct file lists and gate counts"
    vars:
      prompt: |
        GIVEN: A yaks epic with two TDD phases: P1-Core-Logic (write-test, implement, validate) and
        P2-HTTP-Route (write-test, implement, validate). All gates pass. A research artifact
        exists at .light/sessions/discount-codes-research.md. Agent reports include:
        - agent-test P1: Files created: src/lib/discount.test.ts
        - agent-impl P1: Files created/modified: src/lib/discount.ts
        - agent-test P2: Files created: src/app/api/discounts/route.test.ts
        - agent-impl P2: Files created/modified: src/app/api/discounts/route.ts

        TASK: execute plan for the discount codes epic
    assert:
      - type: icontains
        value: ".manifest.json"
      - type: icontains
        value: '"version"'
      - type: icontains
        value: '"files_created"'
      - type: icontains
        value: '"files_modified"'
      - type: icontains
        value: '"workflow_steps"'
      - type: regex
        value: '"gates".*"red_passed".*"green_passed".*"validate_passed"'
      - type: icontains
        value: '"test_suite_passed"'
    metadata:
      skill: implement
      grading: code

  # implement-08: Session manifest correctly classifies files from agent-no-test phases
  - description: "[implement-08] Session manifest classifies agent-no-test files by pre-existence"
    vars:
      prompt: |
        GIVEN: A yaks epic with P1-Schema-Setup (no-test, creates prisma migration) and P2-Core-Logic (TDD).
        Agent reports include:
        - agent-no-test P1: Files created/modified: prisma/schema.prisma, prisma/migrations/001_add_discounts/migration.sql
        - agent-test P2: Files created: src/lib/discount.test.ts
        - agent-impl P2: Files created/modified: src/lib/discount.ts
        prisma/schema.prisma existed before the session. The migration file did not.

        TASK: implement the feature from the yaks task graph
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the implement skill correctly classified files in the session manifest based on pre-existence.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — New file classification (1-3): Was the migration file (which did not exist before) placed in files_created?
            1 = Migration file placed in files_modified or missing entirely
            2 = Classification mentioned but ambiguous
            3 = Migration file clearly placed in files_created

          Dimension 2 — Existing file classification (1-3): Was prisma/schema.prisma (which existed before) placed in files_modified?
            1 = schema.prisma placed in files_created or missing entirely
            2 = Classification mentioned but ambiguous
            3 = schema.prisma clearly placed in files_modified

          Dimension 3 — Agent-test files (1-3): Were files from agent-test reports placed in files_created?
            1 = Test files placed in files_modified
            2 = Classification mentioned but not clearly files_created
            3 = Test files clearly placed in files_created

          Dimension 4 — Pre-existence check (1-3): Did the skill demonstrate awareness that agent-no-test's combined report requires checking file existence?
            1 = No mention of checking whether files existed before the session
            2 = Mentioned but did not clearly apply the check
            3 = Explicitly checked or stated that file existence determines classification for agent-no-test reports

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: implement
      grading: llm-judge

# ---------------------------------------------------------------------------
# TDD skill scenarios
# ---------------------------------------------------------------------------

  # tdd-01: Creates tdd-session-log.md as the first file written to disk before any test or production code
  - description: "[tdd-01] Creates tdd-session-log.md before any test or production code"
    vars:
      prompt: |
        GIVEN: A project with no existing tdd-session-log.md. No test files for the target module yet.
        The user wants to implement a discount code validator using TDD.

        TASK: let's do TDD on this new discount code validator
    assert:
      - type: icontains
        value: "tdd-session-log.md"
      - type: icontains
        value: "[PLAN]"
      - type: regex
        value: "mode: auto|mode: human|Using TDD skill"
    metadata:
      skill: tdd
      grading: code

  # tdd-02: TEST comments written as first code artifact — before any production code — with ZOMBIES annotations
  - description: "[tdd-02] [TEST] comments written before production code, with ZOMBIES annotations"
    vars:
      prompt: |
        GIVEN: A fresh TDD session for a simple calculator add() function. No existing source files for the module.

        TASK: use test driven development to build the payment processor
    assert:
      - type: icontains
        value: "[TEST]"
      - type: regex
        value: "<- Z|<- O|<- M|<- B|<- I|<- E|<- S"
      - type: icontains
        value: "[PLAN]"
    metadata:
      skill: tdd
      grading: code

  # tdd-03: Every ZOMBIES letter appears at least once across the test plan
  - description: "[tdd-03] Every ZOMBIES letter appears at least once in the test plan"
    vars:
      prompt: |
        GIVEN: A TDD session for a non-trivial module with multiple behaviors (e.g., a coupon code validator
        that handles empty input, single codes, multiple codes, boundary lengths, the public API surface,
        invalid format errors, and basic valid input).

        TASK: write tests first for the order total calculation
    assert:
      - type: icontains
        value: "<- Z"
      - type: icontains
        value: "<- O"
      - type: icontains
        value: "<- M"
      - type: icontains
        value: "<- B"
      - type: icontains
        value: "<- I"
      - type: icontains
        value: "<- E"
      - type: icontains
        value: "<- S"
    metadata:
      skill: tdd
      grading: code

  # tdd-04: Phase separation enforced — failing test written and confirmed before implementation begins
  - description: "[tdd-04] Phase separation enforced — RED confirmed before implementation"
    vars:
      prompt: |
        GIVEN: A TDD session for a new add() method that does not yet exist.
        The first [TEST] comment has been converted to a real test.

        TASK: red green refactor the new authentication middleware
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the TDD skill correctly enforced phase separation (RED before GREEN).

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Two-step RED phase (1-3): Did Claude demonstrate compile failure then assertion failure?
            1 = No RED phase observed; went directly to implementation
            2 = RED phase present but only one step (either compile or assertion, not both)
            3 = Two-step RED: compile error observed first, then assertion failure after minimal stub added

          Dimension 2 — [RED-PREDICT] logged (1-3): Does tdd-session-log.md contain a [RED-PREDICT] entry before the test is run?
            1 = No [RED-PREDICT] entry
            2 = Prediction mentioned informally without a formal log entry
            3 = [RED-PREDICT] entry present in tdd-session-log.md before the test was run

          Dimension 3 — [RED-CONFIRM] logged (1-3): Does the log contain a [RED-CONFIRM] entry with the actual failure message?
            1 = No [RED-CONFIRM] entry
            2 = Confirmation present but without the actual failure message
            3 = [RED-CONFIRM] entry with actual failure output present

          Dimension 4 — Implementation after RED-CONFIRM (1-3): Was production code written only after [RED-CONFIRM]?
            1 = Production code was written before RED was confirmed
            2 = Order unclear from the output
            3 = [RED-CONFIRM] is logged before any production implementation code appears

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: tdd
      grading: llm-judge

  # tdd-05: No production code written without a test requiring it — simplification step removes unjustified code
  - description: "[tdd-05] Simplification step removes unjustified code after tests go green"
    vars:
      prompt: |
        GIVEN: A TDD session mid-stream. Agent has just made tests pass by writing implementation code.
        Some of the implementation code does more than the failing test strictly required.

        TASK: start with the tests — let them guide the implementation
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the TDD skill correctly applied simplification discipline after tests went green.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Simplification review (1-3): Did Claude ask for each code line whether a failing test requires it?
            1 = No simplification review performed after tests went green
            2 = Some review performed but not systematic line-by-line
            3 = Systematic review: for each piece of code, Claude checked whether a failing test required it

          Dimension 2 — Unjustified code removed or covered (1-3): Was unjustified code deleted or covered by a new [TEST]?
            1 = Unjustified code was left in place
            2 = Some unjustified code removed but not all
            3 = All unjustified code was either deleted or a new [TEST] comment was added to cover it

          Dimension 3 — [REFACTOR] entries logged (1-3): Does tdd-session-log.md contain [REFACTOR] entries?
            1 = No [REFACTOR] entries in the session log
            2 = Refactoring mentioned but no formal [REFACTOR] log entries
            3 = [REFACTOR] entries describing refactorings applied are present in tdd-session-log.md

          Dimension 4 — Stage announcements (1-3): Did Claude announce refactoring start and completion?
            1 = No stage announcements
            2 = One announcement present (start or completion, not both)
            3 = Claude announced both "Starting refactoring stage" and "Refactoring complete"

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: tdd
      grading: llm-judge

# ---------------------------------------------------------------------------
# HARNESS skill scenarios
# ---------------------------------------------------------------------------

  # harness-01: Harness audit contains all nine pillars with correct status values
  # Note: --print mode cannot write files, so we test content quality rather than file creation.
  - description: "[harness-01] Harness audit contains all nine pillars with status values"
    vars:
      prompt: |
        GIVEN: A TypeScript project with: package.json, tsconfig.json (strict: false), no .pre-commit-config.yaml,
        no .claude/settings.json, a basic .github/workflows/ci.yml that only runs tests, CLAUDE.md at 50 lines,
        .eslintrc.json with only recommended rules, no gitleaks config, no architecture test tools.

        TASK: audit my harness — I want to know what controls are missing in this TypeScript project
    assert:
      # Key pillar concepts present (model may use variant labels)
      - type: regex
        value: "CLAUDE\\.md|[Ii]nstruction [Ff]ile"
      - type: regex
        value: "[Hh]ooks|settings\\.json"
      - type: regex
        value: "[Tt]ype [Ss]afety|tsconfig|strict"
      - type: regex
        value: "[Ll]int"
      - type: regex
        value: "[Pp]re-commit"
      - type: regex
        value: "[Aa]rchitect"
      - type: regex
        value: "CI|[Gg]ate|pipeline"
      - type: regex
        value: "[Ss]ecret"
      # Status-like values present (model may use Strong/Partial/Missing or emoji equivalents)
      - type: regex
        value: "Missing|Weak|Partial|Strong|N/A|❌|⚠️|✅"
      # Correct assessment of specific pillars
      - type: llm-rubric
        value: |
          Evaluate whether the harness audit correctly assessed this TypeScript project:
          - tsconfig.json with strict: false → Type Safety should be weak/partial (not strong or fully missing)
          - No .claude/settings.json → Hooks should be missing
          - No .pre-commit-config.yaml → Pre-commit should be missing
          - CLAUDE.md exists at 50 lines → Instruction files should be partial/weak (exists but insufficient)
          - .eslintrc.json with only recommended rules → Linting should be partial/weak

          PASS if at least 4 of 5 pillar statuses are directionally correct. FAIL otherwise.
          Return: PASS or FAIL, with a count of correct/incorrect pillar assessments.
    metadata:
      skill: harness
      grading: code

  # harness-02: Audit correctly identifies Python-specific gaps and recommends appropriate tools
  - description: "[harness-02] Python project audit identifies correct gaps and recommends Python tools"
    vars:
      prompt: |
        GIVEN: A Python project with: pyproject.toml (no ruff config), no .pre-commit-config.yaml,
        CLAUDE.md at 100 lines, no .claude/settings.json, no mypy.ini or pyrightconfig.json,
        a basic .github/workflows/ci.yml that only runs pytest.

        TASK: audit my harness for this Python project and tell me what I should strengthen
    assert:
      # Python-specific tool recommendations (case-insensitive via character classes)
      - type: regex
        value: "[Rr]uff|[Pp]yright|[Mm]ypy"
      - type: regex
        value: "pre-commit|[Gg]itleaks"
      # Correct pillar statuses for this project
      - type: icontains
        value: "Missing"
      - type: icontains
        value: "Hooks"
      - type: icontains
        value: "Type Safety"
      - type: llm-rubric
        value: |
          Evaluate whether the harness audit for this Python project is accurate and recommends the right tools.

          The project has: pyproject.toml (no ruff), no pre-commit, CLAUDE.md at 100 lines, no .claude/settings.json,
          no mypy/pyright, basic CI that only runs pytest.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Python-specific recommendations (1-3): Does the audit recommend Python tools (ruff, pyright/mypy, pip-audit)?
            1 = Generic recommendations not specific to Python
            2 = Some Python tools mentioned but missing key ones (e.g., no type checker recommendation)
            3 = Recommends ruff for linting, pyright or mypy for type checking, and Python-appropriate pre-commit hooks

          Dimension 2 — Gap accuracy (1-3): Are the Missing/Partial statuses correct?
            1 = Multiple pillar statuses are wrong
            2 = Most are correct but 1-2 are miscategorized
            3 = Hooks=Missing, Type Safety=Missing, Linting=Missing, Pre-commit=Missing are all correct

          Dimension 3 — Actionable output (1-3): Does the audit provide enough detail to act on?
            1 = Only lists pillar names and statuses with no specifics
            2 = Some detail but missing concrete tool/config recommendations
            3 = Each gap includes specific tools, config files, and what to change

          Dimension 4 — Prioritization (1-3): Does the audit suggest which improvements to tackle first?
            1 = No prioritization or ordering
            2 = Some implicit ordering but not explicit
            3 = Explicit recommendation of which pillars are highest leverage

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: harness
      grading: llm-judge

  # harness-03: Harness skill produces an accurate audit and avoids proposing changes for already-strong pillars
  # Note: In --print mode, the model may audit the actual repo rather than the hypothetical GIVEN.
  # The judge accepts either interpretation as long as the audit is internally consistent.
  - description: "[harness-03] Produces accurate audit and avoids changes for strong pillars"
    vars:
      prompt: |
        Assume this is a TypeScript project with these files already configured:
        - tsconfig.json with strict: true and noUncheckedIndexedAccess: true
        - .eslintrc.json with @typescript-eslint/recommended-type-checked + strict rules
        - .pre-commit-config.yaml with gitleaks, eslint, and tsc hooks
        - .claude/settings.json with PostToolUse hooks that run eslint after edits
        - .github/workflows/ci.yml with three sequential gates: lint, test, integration
        - CLAUDE.md at 150 lines covering build commands, test runners, and conventions

        Based on this project description, audit the harness and identify which pillars are strong vs missing.
    assert:
      - type: icontains
        value: "Strong"
      - type: icontains
        value: "Type Safety"
      - type: icontains
        value: "Linting"
      - type: llm-rubric
        value: |
          Evaluate whether the harness audit correctly assesses the described TypeScript project.

          The project has: strict TypeScript, type-checked ESLint, pre-commit with gitleaks+eslint+tsc,
          PostToolUse hooks, three-gate CI, and a well-sized CLAUDE.md.

          Score each dimension 1-3. Pass threshold: 6 out of 9.

          Dimension 1 — Strong detection (1-3): Did the audit identify that multiple pillars are well-configured?
            1 = Audit says most things are missing despite the described config
            2 = Some pillars correctly assessed but the audit underestimates the project's maturity
            3 = Audit recognizes that Type Safety, Linting, Pre-commit, Hooks, and CI Gates are well-configured

          Dimension 2 — No unnecessary proposals (1-3): Did the skill avoid proposing changes for pillars it assessed as strong?
            1 = Proposed changes for pillars it marked as well-configured
            2 = Minor suggestions for already-strong pillars
            3 = No changes proposed for pillars assessed as strong or well-configured

          Dimension 3 — Internal consistency (1-3): Is the audit internally consistent (status matches findings)?
            1 = Status labels contradict the findings text
            2 = Mostly consistent with minor inconsistencies
            3 = Every pillar's status label matches its finding description

          Return: PASS or FAIL, total score (e.g. "7/9"), one sentence per dimension.
    metadata:
      skill: harness
      grading: llm-judge

# ---------------------------------------------------------------------------
# REFLECT skill scenarios
# ---------------------------------------------------------------------------

  # reflect-01: Reflection artifact contains Agent Dispatch Manifest table with all 4 required agent rows
  - description: "[reflect-01] Reflection artifact contains Agent Dispatch Manifest with all 4 agent rows"
    vars:
      prompt: |
        GIVEN: A git repository with at least 5 commits. The .light/ directory exists with at least
        one recent plan file. CLAUDE.md is present at the project root. The reflect skill is loaded.

        TASK: reflect on the session — we just finished implementing the OAuth feature
    assert:
      - type: regex
        value: ".light/\\d{4}-\\d{2}-\\d{2}-[a-z0-9-]+-reflection\\.md"
      - type: icontains
        value: "## Agent Dispatch Manifest"
      - type: icontains
        value: "Git Historian"
      - type: icontains
        value: "Artifact Scout"
      - type: icontains
        value: "Context Reader"
      - type: icontains
        value: "Skill Inspector"
    metadata:
      skill: reflect
      grading: code

  # reflect-02: Improvement proposals are capped at 5, priority-ordered, with all required fields
  - description: "[reflect-02] Improvement proposals capped at 5, priority-ordered, with all required fields"
    vars:
      prompt: |
        GIVEN: A project with git history showing a recent implement session. The session involved multiple
        tool calls, at least one re-try or correction, and a final passing test suite. The reflect skill is loaded.

        TASK: retrospective — we just finished the payment refactor session and there was noticeable friction around how the implement skill handles remediation
    assert:
      - type: regex
        value: "## Improvement Proposals|## Proposals"
      - type: icontains
        value: "P1"
      - type: regex
        value: "Type:.*skill-update|Type:.*claude-md|Type:.*hook|Type:.*plan-template|Type:.*new-skill"
      - type: icontains
        value: "Priority:"
      - type: icontains
        value: "Target"
      - type: icontains
        value: "Rationale"
    metadata:
      skill: reflect
      grading: code

  # reflect-03: Improvement proposals are actionable, relevant to the session, and avoid invented problems
  - description: "[reflect-03] Proposals are actionable, session-relevant, and avoid invented problems"
    vars:
      prompt: |
        GIVEN: A project with the following simulated session context:
        - git log shows 3 commits in the last hour: "implement: implement discount validator",
          "implement: fix failing test for edge case", "implement: add integration test"
        - implement-execution-log.md shows one remediation cycle (a lint error that was auto-fixed)
        - No existing AskUserQuestion hook in .claude/settings.json
        - The implement skill's SKILL.md does not mention the lint fast-path behavior in its anti-patterns section

        TASK: reflect on the implement session — the lint auto-fix step caused confusion because it wasn't documented anywhere
    assert:
      - type: llm-rubric
        value: |
          You are evaluating a reflect skill output. The session context included:
          - 3 implement commits (implement discount validator, fix failing test for edge case, add integration test)
          - One lint auto-fix remediation cycle documented in implement-execution-log.md
          - The lint fast-path behavior is absent from the implement skill.md anti-patterns section
          - No AskUserQuestion hook exists in .claude/settings.json

          Score each dimension from 1-3, then compute the total. Pass threshold: 9 out of 12.

          Dimension 1 — Relevance (1-3): Are proposals grounded in the actual session context?
            1 = Proposals are generic or reference files not in the session context
            2 = Most proposals reference session artifacts but one or more feel invented
            3 = All proposals are directly traceable to session evidence

          Dimension 2 — Actionability (1-3): Are proposals specific enough to implement without further clarification?
            1 = Proposals are vague ("improve the skill", "add more context")
            2 = Most proposals are actionable but one is underspecified
            3 = Every proposal has a clear Target file and a Proposed change that could be implemented immediately

          Dimension 3 — Anti-pattern adherence (1-3): Does the output avoid the anti-patterns listed in the skill?
            1 = Multiple anti-patterns violated (invented problems, bundled proposals, sweeping rewrites)
            2 = One anti-pattern violation (e.g., slightly over-broad proposal)
            3 = No anti-pattern violations; proposals are small and targeted

          Dimension 4 — Proposal count (1-3): Is the number of proposals appropriate?
            1 = More than 5 proposals (violates the cap constraint)
            2 = Exactly 5 proposals (at the cap, acceptable)
            3 = 3-4 proposals (focused; signal over noise)

          Total score (sum of all dimensions): pass if >= 9 out of 12.
          Return: PASS or FAIL, the total score, and one sentence per dimension explaining the score.
    metadata:
      skill: reflect
      grading: llm-judge

# ---------------------------------------------------------------------------
# REVIEW skill scenarios
# ---------------------------------------------------------------------------

  # review-01: Determines diff scope via staged -> unstaged -> default-branch fallback, stops cleanly when empty
  - description: "[review-01] Diff-scope fallback chain, clean stop when there is nothing to review"
    vars:
      prompt: |
        GIVEN: A git repository with no staged changes, no unstaged changes, and no commits ahead of the
        default branch.

        TASK: review my changes
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the review skill correctly resolved diff scope and stopped cleanly.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Fallback chain (1-3): Did the skill check staged, then unstaged, then default-branch diff in order?
            1 = No evidence of checking multiple diff sources in order
            2 = Checked more than one source but order is unclear
            3 = Clearly checked staged first, then unstaged, then default-branch comparison

          Dimension 2 — Empty diff detected (1-3): Did the skill correctly conclude there is nothing to review?
            1 = Skill proceeded as if there were changes to review
            2 = Skill hedged or asked the user instead of concluding there was nothing to review
            3 = Skill explicitly stated there is nothing to review

          Dimension 3 — Clean stop (1-3): Did the skill stop without dispatching any specialist agents?
            1 = Specialist agents were dispatched despite no diff
            2 = Unclear whether any dispatch occurred
            3 = No specialist agents were dispatched

          Dimension 4 — User communication (1-3): Did the skill clearly tell the user why it stopped?
            1 = No explanation given
            2 = Vague explanation
            3 = Clear statement that no diff was found across all three fallback sources

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: review
      grading: llm-judge

  # review-02: Dispatches only the specialists relevant to changed files, always including universal specialists, and reports skips with reasons
  - description: "[review-02] Conditional specialist dispatch matches changed files; skips reported with reasons"
    vars:
      prompt: |
        GIVEN: A diff that only touches a Ruby model file and an RSpec spec file — no migration, no
        frontend, no CI config, no JS/JSX files.

        TASK: review this diff
    assert:
      - type: icontains
        value: "basic-quality"
      - type: icontains
        value: "security"
      - type: icontains
        value: "diff-cleanliness"
      - type: icontains
        value: "rails"
      - type: llm-rubric
        value: |
          You are evaluating whether the review skill dispatched only the relevant specialists for a
          Ruby-only diff (model file + RSpec spec, no migration/frontend/CI files).

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Universal specialists always run (1-3): Were basic-quality, security, and diff-cleanliness all dispatched?
            1 = One or more universal specialists missing
            2 = All present but not clearly stated as always-run
            3 = All three universal specialists clearly dispatched

          Dimension 2 — Rails specialist dispatched (1-3): Was agent-rails dispatched given Ruby application files changed?
            1 = agent-rails was not dispatched
            2 = Rails mentioned but dispatch is ambiguous
            3 = agent-rails clearly dispatched

          Dimension 3 — Irrelevant specialists skipped (1-3): Were database, frontend, accessibility, react, and stimulus-turbo all skipped?
            1 = One or more irrelevant specialists were dispatched
            2 = Skipped but without explanation
            3 = All irrelevant specialists skipped, each with a stated reason (no matching file types)

          Dimension 4 — Skip reasons reported (1-3): Did the report explicitly state which specialists ran vs were skipped and why?
            1 = No mention of what was skipped
            2 = Skips mentioned but without reasons
            3 = Explicit list of specialists run and skipped, each skip with a reason

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: review
      grading: llm-judge

  # review-03: All applicable specialists are dispatched in a single parallel message, not sequentially
  - description: "[review-03] Specialists dispatched in parallel, not sequentially"
    vars:
      prompt: |
        GIVEN: A diff touching a Rails controller, an ERB view with interactive elements, and a Stimulus
        controller — enough to trigger at least four specialists.

        TASK: run a review
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the review skill dispatched specialist agents in parallel.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Parallel dispatch (1-3): Did multiple Agent tool calls appear in a single message?
            1 = Specialists were dispatched sequentially across multiple turns
            2 = Some parallelism but not all specialists batched together
            3 = Multiple Agent calls issued in a single message (true parallel dispatch)

          Dimension 2 — Diff-scoped instructions (1-3): Was each specialist given the diff content rather than told to read the whole repo?
            1 = Specialists were told to explore the whole codebase
            2 = Ambiguous scoping instructions
            3 = Each specialist clearly received the diff content and was scoped to changed lines

          Dimension 3 — No sequential await pattern (1-3): Did the skill avoid dispatching one specialist, awaiting it, then dispatching the next?
            1 = Clear sequential pattern observed
            2 = Partially sequential but some batching evident
            3 = No sequential await pattern detected; all specialists launched together

          Dimension 4 — Coverage (1-3): Did the dispatched set include agent-rails, agent-frontend or agent-accessibility, and agent-stimulus-turbo?
            1 = Fewer than 2 of the 3 relevant specialists dispatched
            2 = 2 of the 3 dispatched
            3 = All 3 relevant specialists dispatched given the changed file types

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: review
      grading: llm-judge

  # review-04: Compiles a single report with findings normalized, de-duplicated, and never auto-fixes
  - description: "[review-04] Report normalized to High/Medium/Low, de-duplicated, no auto-fix"
    vars:
      prompt: |
        GIVEN: Two specialists (agent-frontend and agent-accessibility) both flag the same missing
        alt-text issue on the same image element. agent-security reports one CRITICAL finding and
        agent-basic-quality reports one MINOR finding.

        TASK: review my changes
    assert:
      - type: regex
        value: "(?i)high priority"
      - type: regex
        value: "(?i)medium priority"
      - type: regex
        value: "(?i)low priority"
      - type: llm-rubric
        value: |
          You are evaluating whether the review skill correctly compiled and normalized its findings.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Severity normalization (1-3): Are findings grouped under High/Medium/Low sections rather than raw CRITICAL/MAJOR/MINOR?
            1 = Report still uses CRITICAL/MAJOR/MINOR as section headers
            2 = Mixed labeling
            3 = Report clearly uses High/Medium/Low priority sections

          Dimension 2 — De-duplication (1-3): Does the duplicate missing-alt-text finding appear exactly once, noting both specialists agreed?
            1 = Finding appears twice (once per specialist)
            2 = Appears once but doesn't note specialist agreement
            3 = Appears exactly once and notes that both specialists flagged it

          Dimension 3 — No auto-fix or side effects (1-3): Did the skill avoid editing files, posting PR comments, or creating tracker issues?
            1 = Skill took an auto-fix or side-effect action
            2 = Ambiguous — skill suggested but didn't confirm avoiding action
            3 = Skill clearly presented findings only, took no file-editing or external action

          Dimension 4 — Specialists Run section (1-3): Does the report include a section listing what ran and what was skipped?
            1 = No such section
            2 = Present but incomplete
            3 = Clear "Specialists Run" section listing what ran and what was skipped

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: review
      grading: llm-judge

  # review-05: A specialist reporting no issues is stated explicitly rather than omitted
  - description: "[review-05] Explicit no-issues statement rather than silent omission"
    vars:
      prompt: |
        GIVEN: A diff where agent-database was dispatched (a migration file changed) but found no issues.

        TASK: review this diff
    assert:
      - type: regex
        value: "(?i)no (database )?issues found"
    metadata:
      skill: review
      grading: code

  # review-06: A failed or timed-out specialist does not block the rest of the review
  - description: "[review-06] Failed specialist does not block the rest of the review"
    vars:
      prompt: |
        GIVEN: Five specialists are dispatched. agent-frontend times out or errors; the other four
        return findings normally.

        TASK: run a review
    assert:
      - type: llm-rubric
        value: |
          You are evaluating whether the review skill handled a failed specialist gracefully.

          Score each dimension 1-3. Pass threshold: 9 out of 12.

          Dimension 1 — Report still produced (1-3): Was a final report produced despite the failure?
            1 = No report produced; review aborted
            2 = Report produced but incomplete without explanation
            3 = Final report produced with the four successful specialists' findings

          Dimension 2 — Failure noted (1-3): Does the report note that the agent-frontend section is incomplete due to a failure?
            1 = No mention of the failure
            2 = Vague mention
            3 = Clear note that agent-frontend failed/timed out and its section is incomplete

          Dimension 3 — Retry offered (1-3): Did Claude offer to retry just the failed specialist?
            1 = No retry offered
            2 = Retry mentioned but as a full re-run rather than targeted
            3 = Clear offer to retry just the failed specialist

          Dimension 4 — No cascading failure (1-3): Did the other four specialists' findings remain intact and unaffected?
            1 = Other specialists' findings were dropped or garbled
            2 = Mostly intact with minor gaps
            3 = All four successful specialists' findings fully present in the report

          Return: PASS or FAIL, total score (e.g. "10/12"), one sentence per dimension.
    metadata:
      skill: review
      grading: llm-judge

# ---------------------------------------------------------------------------
# REVIEW-OUTPUT-FORMAT skill scenarios
# ---------------------------------------------------------------------------
# Note: review-output-format has disable-model-invocation: true — it is never
# triggered directly by a user prompt. These scenarios exercise its contract
# indirectly through the review skill, which is the only consumer of the format.

  # review-output-format-01: Every finding compiled into a review report uses the canonical per-finding template fields
  - description: "[review-output-format-01] Compiled findings use the canonical per-finding template fields"
    vars:
      prompt: |
        GIVEN: A diff touching a Ruby model, an RSpec spec, and a React component — enough to dispatch
        agent-basic-quality, agent-security, agent-diff-cleanliness, agent-rails, and agent-react, each
        with at least one finding.

        TASK: review my changes
    assert:
      - type: regex
        value: "\\[(CRITICAL|MAJOR|MINOR)\\]"
      - type: icontains
        value: "Location"
      - type: icontains
        value: "Issue"
      - type: icontains
        value: "Impact"
      - type: icontains
        value: "Fix"
    metadata:
      skill: review-output-format
      grading: code

  # review-output-format-02: agent-accessibility findings normalize alongside CRITICAL/MAJOR/MINOR findings into the same High/Medium/Low sections
  - description: "[review-output-format-02] Accessibility High/Medium/Low findings normalize alongside CRITICAL/MAJOR/MINOR findings"
    vars:
      prompt: |
        GIVEN: A diff touching a JSX component with a missing alt attribute (triggers agent-accessibility,
        reporting High/Medium/Low) alongside a Ruby controller with a CRITICAL security issue (triggers
        agent-security, reporting CRITICAL/MAJOR/MINOR).

        TASK: check for accessibility issues in this diff
    assert:
      - type: regex
        value: "(?i)high priority"
      - type: llm-rubric
        value: |
          Evaluate whether the compiled review report correctly normalizes severity across specialists
          that report in different native scales (agent-accessibility uses High/Medium/Low natively;
          most other specialists use CRITICAL/MAJOR/MINOR).

          PASS if the report's priority sections are High/Medium/Low, the CRITICAL security finding
          appears under High Priority, and the accessibility finding appears under the priority section
          matching its native level, with no specialist re-labeling CRITICAL/MAJOR/MINOR as something else.
          FAIL if severity sections are inconsistent, mislabeled, or the accessibility finding is dropped.
    metadata:
      skill: review-output-format
      grading: code

  # review-output-format-03: A specialist with no findings is stated explicitly, never silently omitted
  - description: "[review-output-format-03] Explicit no-issues statement, never silently omitted"
    vars:
      prompt: |
        GIVEN: A diff that changes a database migration file with no actual issues — agent-database is
        dispatched but has nothing to report.

        TASK: review this diff
    assert:
      - type: regex
        value: "(?i)no (database )?issues found"
    metadata:
      skill: review-output-format
      grading: code

  # review-output-format-04: Severity tier meaning is applied consistently across specialists, never redefined per specialist
  - description: "[review-output-format-04] Severity tier meaning applied consistently across specialists"
    vars:
      prompt: |
        GIVEN: A diff producing a CRITICAL finding from agent-security and a separate CRITICAL finding
        from agent-basic-quality.

        TASK: run a review
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the compiled review report applies a single, consistent meaning of CRITICAL
          severity across specialists rather than letting each specialist define its own tier semantics.

          PASS if both CRITICAL findings (from agent-security and agent-basic-quality) land in the same
          High Priority section and the report does not contain two different explanations of what
          CRITICAL/High severity means.
          FAIL if the findings are split into different sections or the report defines CRITICAL
          differently per specialist.
    metadata:
      skill: review-output-format
      grading: llm-judge
