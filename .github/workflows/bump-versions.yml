name: Bump marketplace versions

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if the push author is the bot (prevents infinite loop when bump PR merges)
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Bump versions
        run: |
          chmod +x scripts/bump-versions.sh
          ./scripts/bump-versions.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Bump marketplace and plugin versions"
          branch: auto/bump-versions
          title: "Bump marketplace and plugin versions"
          body: "Automated version bump triggered by plugin changes."
          delete-branch: true
